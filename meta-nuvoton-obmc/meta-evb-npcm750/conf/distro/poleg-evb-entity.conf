require conf/distro/openbmc-phosphor.conf

VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"
VIRTUAL-RUNTIME_phosphor-ipmi-providers = ""
PREFERRED_PROVIDER_virtual/obmc-inventory-data = "entity-manager"

DISTRO = "poleg-evb-entity"
DISTRO_NAME = "Nuvoton OpenBMC (Entity Manager)"
DISTRO_FEATURES:append = " entity-manager"

# entity-manager + dbus-sensors do not fit the NPCM750 NOR flash ROFS
# partition with the full feature set, so drop features to make room.
# Fans are controlled by phosphor-pid-control (swampd) and presence comes
# from entity-manager/dbus-sensors, so the phosphor-fan stack is not needed.
VIRTUAL-RUNTIME_obmc-fan-presence = ""
IMAGE_FEATURES:remove = "obmc-fan-control obmc-telemetry obmc-remote-logging-mgmt obmc-devtools"
