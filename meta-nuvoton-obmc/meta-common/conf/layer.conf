# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "common"
BBFILE_PATTERN_common = "^${LAYERDIR}/"
BBFILE_PRIORITY_common = "6"
LAYERSERIES_COMPAT_common = "blacksail wrynose whinlatter"

# meta-nuvoton's gcc-arm-none-eabi_9-2019-q4-major.bb is only used to build
# the NPCM8xx TIP FW from source (TIP_FW_SOURCE = "True"), and it requires
# arm-binary-toolchain.inc from meta-arm-toolchain. Mask it when that layer
# is not in BBLAYERS (e.g. npcm7xx machines) so parsing does not fail.
BBMASK += "${@'' if 'arm-toolchain' in (d.getVar('BBFILE_COLLECTIONS') or '').split() else '/meta-nuvoton/recipes-devtools/external-arm-toolchain/'}"
