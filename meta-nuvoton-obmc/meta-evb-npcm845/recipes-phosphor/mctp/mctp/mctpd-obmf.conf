# mctpd bus-owner configuration for the OBMF distro.
[mctp]
message_timeout_ms = 30

[bus-owner]
# The BMC local EID is 8 (mctp-config / 90-mctp.rules). The upstream default
# range [8, 254] lets mctpd hand EID 8 to a remote endpoint when SMC1
# re-enumerates: the local address disappears with the old mctpusb0 and is
# only re-added by udev after mctpreactor has already set up the new
# endpoints. Keep dynamically assigned EIDs clear of the local EID.
dynamic_eid_range = [9, 254]
