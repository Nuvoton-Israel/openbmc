# USB TTY ACM
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_ACM=y
CONFIG_USB_F_ACM=y

# FS
CONFIG_VFAT_FS=y

# NCSI
CONFIG_NCSI_OEM_CMD_GET_MAC=y

# USB OHCI GENERIC
CONFIG_USB_OHCI_HCD_PLATFORM=y

# MUX controller for setting UART switch mode
CONFIG_IIO_MUX=y
CONFIG_MULTIPLEXER=y
CONFIG_MUX_MMIO=y

# ESPI MMBI
CONFIG_NPCM_ESPI_MMBI=y
CONFIG_CRC8=y

# ESPI VW FPIO
CONFIG_GPIO_NPCM_ESPI_VW=y

# ESPI Slave driver
CONFIG_NPCM_ESPI_SLAVE=y

# GDMA Driver
CONFIG_NPCM_GDMA=y
CONFIG_DMADEVICES=y

# UART enables
CONFIG_SERIAL_8250_NR_UARTS=6
CONFIG_SERIAL_8250_RUNTIME_UARTS=6

# TPM/RPMB support
CONFIG_RPMB=y

# Disable PCIE MMBI
# CONFIG_NPCM_PCI_MMBI is not set

# Enable crypto benchmark module (tcrypt)
CONFIG_CRYPTO_BENCHMARK=m

# Symbol/Trace optimization
CONFIG_KALLSYMS_ALL=n
CONFIG_FTRACE=n

# Wireless/WLAN
CONFIG_WIRELESS=n
CONFIG_WLAN=n
CONFIG_WLAN_VENDOR_ADMTEK=n
CONFIG_WLAN_VENDOR_ATH=n
CONFIG_WLAN_VENDOR_ATMEL=n
CONFIG_WLAN_VENDOR_BROADCOM=n
CONFIG_WLAN_VENDOR_INTEL=n
CONFIG_WLAN_VENDOR_INTERSIL=n
CONFIG_WLAN_VENDOR_MARVELL=n
CONFIG_WLAN_VENDOR_MEDIATEK=n
CONFIG_WLAN_VENDOR_MICROCHIP=n
CONFIG_WLAN_VENDOR_PURELIFI=n
CONFIG_WLAN_VENDOR_RALINK=n
CONFIG_WLAN_VENDOR_REALTEK=n
CONFIG_WLAN_VENDOR_RSI=n
CONFIG_WLAN_VENDOR_SILABS=n
CONFIG_WLAN_VENDOR_ST=n

# Unused filesystem support (not needed for this OpenBMC image)
CONFIG_VFAT_FS=n
CONFIG_NTFS3_FS=n

CONFIG_BRIDGE=y
CONFIG_BRIDGE_VLAN_FILTERING=y
CONFIG_STP=y
CONFIG_BRIDGE_IGMP_SNOOPING=y

# veth pair for the L2-switch virtual ports (vport0 <-> vport0br)
CONFIG_VETH=y

# CONFIG_MTD_SPI_NOR_USE_4K_SECTORS is not set

 
