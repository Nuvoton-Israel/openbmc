# Keep this above the require. npcm8xx.inc, pulled in below, already carries a
# "?=" default for TIP_FW_SOURCE, so an assignment placed after the require
# would be a no-op. Setting it here still lets local.conf win, because
# local.conf is parsed before any machine conf.
#
# "False" uses the pre-built, Nuvoton pre-signed TIP FW. The EVB has Nuvoton
# production keys fused into OTP with SECBOOT enabled, so the mask ROM rejects
# a KMT signed with the default keys IGPS carries in its repository and the
# board drops into recovery. "True" builds the TIP FW from source and only
# boots on parts whose OTP holds a key we can sign with.
TIP_FW_SOURCE ?= "False"

require ../../../../meta-nuvoton/conf/machine/evb-npcm845.conf

FLASH_SIZE = "65536"
FLASH_UBOOT_OFFSET:flash-65536 = "0"
FLASH_MANIFEST_OFFSET:flash-65536 = "3832"
FLASH_UBOOT_ENV_OFFSET:flash-65536 = "7936"
FLASH_KERNEL_OFFSET:flash-65536 = "8192"
FLASH_ROFS_OFFSET:flash-65536 = "16384"
FLASH_RWFS_OFFSET:flash-65536 = "61440"

#UBOOT_SIGN_ENABLE = "1"
#FIT_GENERATE_KEYS = "1"
#UBOOT_SIGN_KEYDIR = "${DEPLOY_DIR_IMAGE}/uboot-sign-dir"
#UBOOT_SIGN_KEYNAME = "Nuvoton"

DISTRO_FEATURES:append = " tpm"
MACHINE_FEATURES:append = " tpm2"
MACHINE_FEATURES:append = " optee-ftpm"

PREFERRED_VERSION_linux-nuvoton ??= "6.12.%"
#Linux kernel 6.18 support
#PREFERRED_VERSION_linux-nuvoton ??= "6.18.%"

PREFERRED_VERSION_u-boot-nuvoton ??= "v2026.07+git"
PREFERRED_VERSION_u-boot-fw-utils-nuvoton ?= "v2026.07+git"
TEE_GROUP_NAME = "teeclnt"

include conf/distro/include/mctp.inc
