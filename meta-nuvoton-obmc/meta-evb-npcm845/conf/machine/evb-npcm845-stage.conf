require ../../../../meta-nuvoton/conf/machine/evb-npcm845.conf

FLASH_SIZE = "65536"
FLASH_UBOOT_OFFSET:flash-65536 = "0"
FLASH_MANIFEST_OFFSET:flash-65536 = "3832"
FLASH_UBOOT_ENV_OFFSET:flash-65536 = "7936"
FLASH_KERNEL_OFFSET:flash-65536 = "8192"
FLASH_ROFS_OFFSET:flash-65536 = "16384"
FLASH_RWFS_OFFSET:flash-65536 = "61440"

#UBOOT_SIGN_ENABLE = "1"
#FIT_GENERATE_KEYS = "1"
#UBOOT_SIGN_KEYDIR = "${DEPLOY_DIR_IMAGE}/uboot-sign-dir"
#UBOOT_SIGN_KEYNAME = "Nuvoton"


DISTRO_FEATURES:append = " tpm"
MACHINE_FEATURES:append = " tpm2"
MACHINE_FEATURES:append = " optee-ftpm"

PREFERRED_VERSION_linux-nuvoton ??= "6.12%"
PREFERRED_VERSION_u-boot-nuvoton ??= "v2025.07+git"
PREFERRED_VERSION_u-boot-fw-utils-nuvoton ?= "v2025.07+git"
PREFERRED_VERSION_optee-os = "4.3%"
PREFERRED_VERSION_optee-client = "4.3%"
TEE_GROUP_NAME = "teeclnt"
