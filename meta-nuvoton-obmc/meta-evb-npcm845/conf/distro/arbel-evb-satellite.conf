require conf/distro/openbmc-phosphor.conf

# Redfish Satellite BMC.
#
# The NPCM845 acts as a USB *device* (gadget) towards an Aggregator BMC (USB
# host) with a CDC ECM network: Redfish/bmcweb reachable at 192.168.7.1.

VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"
VIRTUAL-RUNTIME_phosphor-ipmi-providers = ""
PREFERRED_PROVIDER_virtual/obmc-inventory-data = "entity-manager"

DISTRO = "arbel-evb-satellite"
DISTRO_NAME = "Nuvoton OpenBMC (Redfish Satellite BMC)"
DISTRO_FEATURES:append = " entity-manager satellite"
DISTROOVERRIDES .= ":df-satellite"

PREFERRED_VERSION_linux-nuvoton = "6.12.%"
