require conf/distro/openbmc-phosphor.conf

# OBMF (Open Boot and Management Framework) over USB
require conf/distro/include/obmf.inc

VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"
VIRTUAL-RUNTIME_phosphor-ipmi-providers = ""
PREFERRED_PROVIDER_virtual/obmc-inventory-data = "entity-manager"

DISTRO = "arbel-evb-obmf"
DISTRO_NAME = "Nuvoton OpenBMC (OBMF)"
DISTRO_FEATURES:append = " entity-manager"

# OBMF is only on the NPCM-6.12-OBMF-dev kernel branch
PREFERRED_VERSION_linux-nuvoton = "6.12.%"

# evb dtb with nuvoton-npcm845-evb-obmf.dtso applied at kernel build time
KERNEL_DEVICETREE = "nuvoton/nuvoton-npcm845-evb-obmf.dtb"
