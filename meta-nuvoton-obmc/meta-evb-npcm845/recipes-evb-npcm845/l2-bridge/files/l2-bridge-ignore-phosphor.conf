# Prevent phosphor-networkd from managing any interface that belongs to the
# software L2 switch fabric. phosphor-networkd auto-manages every ethernet
# interface it sees and writes /etc/systemd/network/00-bmc-<intf>.network with
# DHCP=yes (plus link-local fallback). Those 00-bmc-* files sort BEFORE our
# 10-*/20-* files, so without this override phosphor would:
#   - give br0 a DHCP address (br0 must stay a pure L2 switch with NO IP),
#   - give vport0br/vport1 link-local addresses (bridge ports must have no IP),
#   - and steal DHCP from vport0 (the BMC OOB port that should get the lease).
# Listing them here makes systemd-networkd's static config (shipped by
# l2-bridge and usb-network-ecm) the single source of truth for the fabric.
[Service]
Environment="IGNORED_INTERFACES=eth0,br0,vport0,vport0br,vport1"
