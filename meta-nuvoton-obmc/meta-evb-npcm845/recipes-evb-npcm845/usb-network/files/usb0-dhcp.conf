# dnsmasq configuration for BMC USB network (CDC ECM)
# Provides DHCP to RHEL host connected via USB gadget (192.168.7.1)
#
# This file is dropped into /etc/dnsmasq.d/ so the system dnsmasq handles
# USB DHCP — avoids port 67 conflict from running a second dnsmasq instance.

# Only serve DHCP on usb0
interface=usb0

# Assign exactly 192.168.7.1 to the USB host
dhcp-range=interface:usb0,192.168.7.1,192.168.7.1,255.255.255.0,12h

# Do not advertise gateway or DNS (direct link only)
dhcp-option=interface:usb0,option:router
dhcp-option=interface:usb0,option:dns-server
