# NPCM500 JTAG2 = LCC-TAP (1 TAP) via Arbel /dev/jtag1
# JEN1#..JEN4# = 0101 (LC transitions RAW/TestUnlocked/MANUF/PROD), JTAG1 = MCU-TAP
# LCC TAP has no RISC-V debug module: this cfg only declares the TAP and
# scans it. LC transition commands need a separate LCC DMI script.
# NOT yet verified on hardware.
# Usage: openocd -f 0101_jtag2_lcc.cfg

adapter driver npcm_jtag
transport select jtag
adapter speed 100
npcm_jtag_device jtag1

jtag newtap lcc tap -irlen 5

init
scan_chain
