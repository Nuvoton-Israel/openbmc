# NPCM500 JTAG2 = M7-DAP (1 TAP) via Arbel /dev/jtag1
# JEN1#..JEN4# = 0001 / 0010 / 0011 / 0110 / 0111 / 1000 / 1010
# Verified on FPGA ver252 (IDCODE 0x0BA02477, Cortex-M7 r1p2). M7 IR = 4 bits.
# Single TAP, no 'targets' switch needed.
# Usage: openocd -f 0011_jtag2_m7.cfg

adapter driver npcm_jtag
transport select jtag
adapter speed 1000
npcm_jtag_device jtag1

jtag newtap cm7 cpu -irlen 4 -expected-id 0x0BA02477 -expected-id 0x2BA01477
dap create cm7.dap -chain-position cm7.cpu
target create m7 cortex_m -dap cm7.dap

init
