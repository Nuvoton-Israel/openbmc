#
# Caliptra MCU (RISC-V VeeR EL2) JTAG test via NPCM845 Arbel JTAG Master
#
# NPCM500 FPGA JTAG2 mux: SICOFD[6:4]=001 -> CPTRA_MCU on IO/PAD_2
#
# Prerequisites:
#   gpioset 2 6=0    (enable Arbel JTAG master)
#   ROM .hex must have set SICOFD[6:4]=001
#
# Usage from Arbel BMC console:
#   openocd -f /usr/share/openocd/scripts/caliptra_mcu.cfg
#
# Reference: antmicro/caliptra-rtl tools/scripts/openocd/target/veer-el2.cfg

adapter driver npcm_jtag
transport select jtag
adapter speed 100
npcm_jtag_device jtag0

# VeeR TAP has no IDCODE (caliptra-rtl#298), irlen=5
set _CHIPNAME riscv
jtag newtap $_CHIPNAME tap -irlen 5

set _TARGETNAME $_CHIPNAME.tap
target create $_TARGETNAME.0 riscv -chain-position $_TARGETNAME

# Work area in on-chip SRAM
$_TARGETNAME.0 configure -work-area-phys 0x50001000 -work-area-size 0x1000 -work-area-backup 0

# VeeR requires abstract memory access (no sysbus)
riscv set_mem_access abstract

# Increase DMI timeout to handle slow responses
riscv set_command_timeout_sec 2

# Expose VeeR EL2 custom CSRs
$_TARGETNAME.0 riscv expose_csrs 1984,1986,1992,1993,1994,1995,2032,2041,2047,4032

# Be verbose about GDB errors
gdb_report_data_abort enable
gdb_report_register_access_error enable

# Always use hardware breakpoints (VeeR has limited SW breakpoint support)
gdb_breakpoint_override hard

init

# Disable background polling to avoid DMI timing errors
# (VeeR DTM needs idle cycles between operations; npcm_jtag doesn't insert enough)
# Use 'poll on' in telnet if you need automatic state tracking
poll off

# Halt the core
halt
