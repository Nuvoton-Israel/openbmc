# NPCM500 ARM Cortex-M7 via NPCM845 Arbel JTAG Master 2 (/dev/jtag1)
#
# NPCM500 JEN#1/#2/#3 (SICOFD[6:4]) = 011 -> JTAG2 slave = ARM_M7
# Arbel JTM2 uses JS_* pins (MFSEL5.1 JM2SEL), needs jtm2 enabled in dts.
#
# Prerequisites:
#   gpioset 2 6=0    (enable Arbel JTAG master)
#
# Usage:
#   openocd -f /usr/share/openocd/scripts/cm7_jtm1.cfg

adapter driver npcm_jtag
transport select jtag
adapter speed 1000
npcm_jtag_device jtag1

# FPGA reports 0x0BA02477; 0x2BA01477 kept for compatibility with cm7.cfg
jtag newtap cm7 cpu -irlen 4 -expected-id 0x0BA02477 -expected-id 0x2BA01477
dap create cm7.dap -chain-position cm7.cpu
target create cm7.cpu cortex_m -dap cm7.dap

init
