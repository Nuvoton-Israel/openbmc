# NPCM500 ARM Cortex-M7 via NPCM845 Arbel JTAG Master 1 (/dev/jtag0)
#
# NPCM500 ARM_M7 JTAG slave (JEN 010/011 -> IO/PAD_2) wired to Arbel JTM1
#
# Prerequisites:
#   gpioset 2 6=0    (enable Arbel JTAG master)
#
# Usage:
#   openocd -f /usr/share/openocd/scripts/cm7_jtm0.cfg

adapter driver npcm_jtag
transport select jtag
adapter speed 1000
npcm_jtag_device jtag0

# FPGA reports 0x0BA02477; 0x2BA01477 kept for compatibility with cm7.cfg
jtag newtap cm7 cpu -irlen 4 -expected-id 0x0BA02477 -expected-id 0x2BA01477
dap create cm7.dap -chain-position cm7.cpu
target create cm7.cpu cortex_m -dap cm7.dap

init
