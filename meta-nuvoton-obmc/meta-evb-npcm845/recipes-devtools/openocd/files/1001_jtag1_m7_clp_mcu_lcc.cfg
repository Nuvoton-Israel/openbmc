# NPCM500 JTAG1 = M7-CLP-MCU-LCC full chain (4 TAPs) via Arbel /dev/jtag0
# JEN1#..JEN4# = 1001 (Normal Boot with JTAG Full-Chain), JTAG2 = Multi-Function
#
# Chain (TDI -> M7 -> CLP -> MCU -> LCC -> TDO) assumed from the RD table
# name order; NOT yet verified on hardware. IR: M7-DAP 4 bits, Caliptra 5 bits.
#
# Targets: m7 (cortex_m), clp, mcu (RISC-V).
# Switch in telnet:  targets m7 / targets clp / targets mcu
# Usage: openocd -f 1001_jtag1_m7_clp_mcu_lcc.cfg

adapter driver npcm_jtag
transport select jtag
adapter speed 100
npcm_jtag_device jtag0

jtag newtap lcc tap -irlen 5
jtag newtap mcu tap -irlen 5
jtag newtap clp tap -irlen 5
jtag newtap cm7 cpu -irlen 4 -expected-id 0x0BA02477 -expected-id 0x2BA01477

dap create cm7.dap -chain-position cm7.cpu
target create m7 cortex_m -dap cm7.dap
target create clp riscv -chain-position clp.tap
target create mcu riscv -chain-position mcu.tap
mcu configure -work-area-phys 0x50001000 -work-area-size 0x1000 -work-area-backup 0

foreach t {clp mcu} {
	targets $t
	riscv set_mem_access abstract
	riscv set_command_timeout_sec 2
}
gdb_breakpoint_override hard

init
scan_chain
poll off
targets m7
