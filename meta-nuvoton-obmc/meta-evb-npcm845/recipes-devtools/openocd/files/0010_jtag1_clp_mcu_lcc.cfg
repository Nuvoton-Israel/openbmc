# NPCM500 JTAG1 = CLP-MCU-LCC (3 TAPs) via Arbel /dev/jtag0
# JEN1#..JEN4# = 0001 / 0010 / 0011 / 0110 / 0111 / 1000 / 1010
#
# Chain (TDI -> CLP -> MCU -> LCC -> TDO), OpenOCD declares from TDO side.
# IR length 5 for CLP/MCU/LCC (RD confirmed). Verified on FPGA ver252.
# IDCODE check not used: Caliptra-SS v2.1.2 gives LCC 0x00000001 but MCU/CLP
# have no IDCODE (support from v2.2), so the RISC-V TAPs are told apart by
# switching targets and doing reg read/write.
# RISC-V needs 'targets <name>' to pick the TAP; otherwise commands stay on
# the current target.
#
# Targets: clp, mcu (RISC-V). LCC TAP has no RISC-V debug module (tap only).
# Switch in telnet:  targets clp   /  targets mcu
# Usage: openocd -f 0010_jtag1_clp_mcu_lcc.cfg

adapter driver npcm_jtag
transport select jtag
adapter speed 100
npcm_jtag_device jtag0

jtag newtap lcc tap -irlen 5
jtag newtap mcu tap -irlen 5
jtag newtap clp tap -irlen 5

target create clp riscv -chain-position clp.tap
target create mcu riscv -chain-position mcu.tap
mcu configure -work-area-phys 0x50001000 -work-area-size 0x1000 -work-area-backup 0

foreach t {clp mcu} {
	targets $t
	riscv set_mem_access abstract
	riscv set_command_timeout_sec 2
}
gdb_report_data_abort enable
gdb_report_register_access_error enable
gdb_breakpoint_override hard

init
scan_chain
poll off
targets mcu
